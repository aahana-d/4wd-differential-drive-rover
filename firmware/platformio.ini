; Two environments:
;   esp32dev -> builds/uploads the real firmware onto the rover's ESP32
;   native   -> builds/runs the host-only unit tests, no hardware required

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../common

[env:native]
platform = native
build_flags =
    -std=c++17
    -I../common
    -Iinclude
test_framework = unity
; Only the platform-independent modules are exercised here.
; Anything touching Arduino.h is validated on real hardware / the bench-test procedure in the README instead
test_build_src = false
